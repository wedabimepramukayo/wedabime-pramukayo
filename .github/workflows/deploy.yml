name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client (adapter + edge mode)
        run: npx prisma generate

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Strip Prisma engine/WASM files (not needed with adapter)
        run: |
          # PrismaNeonHTTP adapter sends queries via Neon HTTP API
          # Native engine + WASM files are NOT needed at runtime
          # Removing them reduces bundle from ~107MB to ~37MB
          find .open-next/ \( \
            -name "libquery_engine-*.so.node" -o \
            -name "query_compiler_fast_bg.wasm*" -o \
            -name "query_compiler_bg.*.wasm*" -o \
            -name "query_engine_bg.*.wasm*" \
          \) -type f -delete
          echo "Stripped Prisma engine files. Bundle size:"
          du -sh .open-next/server-functions/default/

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          # Extract the Version ID from the deploy output
          VERSION_ID=$(grep -oP 'Current Version ID: \K[^ ]+' /tmp/wrangler-deploy.log || true)
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
          echo "Deployed version: $VERSION_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Promote latest version to 100% traffic
        run: |
          VERSION_ID="${{ steps.deploy.outputs.version_id }}"
          if [ -n "$VERSION_ID" ]; then
            echo "Promoting version $VERSION_ID to 100% traffic..."
            npx wrangler versions deploy "${VERSION_ID}@100" || true
          else
            echo "Could not get version ID from deploy step, trying list..."
            VERSION_ID=$(npx wrangler versions list --json 2>/dev/null | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            if data:
              # Sort by creation time, get the most recent
              sorted_data = sorted(data, key=lambda x: x.get('created_at', ''), reverse=True)
              print(sorted_data[0]['id'])
            ")
            if [ -n "$VERSION_ID" ]; then
              echo "Promoting version $VERSION_ID to 100% traffic..."
              npx wrangler versions deploy "${VERSION_ID}@100" || true
            else
              echo "Could not get version ID, skipping promotion"
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
